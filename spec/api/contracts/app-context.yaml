name: AppContext
version: "1.0"

description: > 
  Represents the application-scoped context through which a MobileApp and its managed components access application-level runtime resources, configuration, modules, services, and environment information.
  
documentation: 
  id: app-context
  uri: ../../../docs/concepts/app-context.md

properties: 

  appId: 
    type: Identifier
    required: true
    description: > 
      A unique identifier that identifies the application associated with this AppContext within the applicable runtime or deployment environment.
    
  appVersion: 
    type: Version
    required: false
    description: > 
      The version of the application associated with this AppContext.
    
  metadata: 
    type: Metadata
    required: false
    description: > 
      A collection of application-defined descriptive attributes associated with the application represented by this AppContext.
    
operations: 

  getApp: 
  
    returns: 
      type: MobileApp
    
    description: > 
      Retrieves the MobileApp associated with this AppContext.
      
  getModuleRegistry: 
  
    returns: 
      type: ModuleRegistry
      
    description: > 
      Retrieves the application-level registry used to discover, access and manage Modules associated with the MobileApp.
      
  getServiceRegistry: 
  
    returns: 
      type: ServiceRegistry
      
    description: > 
      Retrieves the application-level registry used to discover and access Services available within the MobileApp.
      
  getConfiguration: 
  
    returns: 
      type: Configuration
      
    description: > 
      Retrieves the application-level Configuration available to the MobileApp and its managed components.
      
  getRuntimeEnvironment: 
  
    returns: 
      type: RuntimeEnvironment
      
    description: > 
      Retrieves information about the RuntimeEnvironment in which the MobileApp is operating.