name: AppContext
version: "1.0"

description: > 
  Represents the application-scoped context through which a MobileApp and its managed components access application-level runtime resources, configuration, modules, services, and environment information.

properties: 

  appId: 
    type: Identifier
    required: true
    
  appVersion: 
    type: Version
    required: false
    
  metadata: 
    type: Metadata
    required: false
    
operations: 

  getApp: 
    returns: 
      type: MobileApp
      
  getModuleRegistry: 
    returns: 
      type: ModuleRegistry
      
  getServiceRegistry: 
    returns: 
      type: ServiceRegistry
      
  getConfiguration: 
    returns: 
      type: Configuration
      
  getRuntimeEnvironment: 
    returns: 
      type: RuntimeEnvironment