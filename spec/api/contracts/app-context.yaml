name: AppContext
version: "1.0"

description: > 
  Represents the application-scoped context through which a MobileApp and its managed components access application-level runtime resources, configuration, modules, services, and environment information.

properties: 

  appId: 
    type: Identifier
    required: true
    description: > 
      A unique identifier that identifies the application associated with this AppContext within the applicable runtime or deployment environment.
    
  appVersion: 
    type: Version
    required: false
    description: > 
      The version of the application associated with this AppContext.
    
  metadata: 
    type: Metadata
    required: false
    description: > 
      A collection of application-defined descriptive attributes associated with the application represented by this AppContext.
    
operations: 

  getApp: 
    returns: 
      type: MobileApp
      
  getModuleRegistry: 
    returns: 
      type: ModuleRegistry
      
  getServiceRegistry: 
    returns: 
      type: ServiceRegistry
      
  getConfiguration: 
    returns: 
      type: Configuration
      
  getRuntimeEnvironment: 
    returns: 
      type: RuntimeEnvironment