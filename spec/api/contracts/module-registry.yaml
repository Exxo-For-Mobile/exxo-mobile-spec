name: ModuleRegistry
version: 1.0

description: > 
  Provides application-level registration, discovery, access, and runtime loading management for Modules associated with a MobileApp.

operations: 

  getModule: 
    description: > 
      Retrieves a registered Module using its identifier.
      
  getModules: 
    description: > 
      Retrieves the Modules currently registered with the registry.
      
  registerModule: 
    description: > 
      Registers a Module with the registry.
      
  unregisterModule: 
    description: > 
      Removes a Module from the registry.
      
  loadModule: 
    description: > 
      Loads a Module and makes it available to the registry.
      
  unloadModule: 
    description: > 
      Unloads a Module from the registry and releases its framework-managed resources.